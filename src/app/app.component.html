<p-menubar>
  <ng-template #start>
    <div class="marca">
      <i class="pi pi-box"></i>
      <span>Simulador Docker</span>
    </div>
  </ng-template>
</p-menubar>

<main class="area-trabalho">
  <p-splitter layout="vertical" [gutterSize]="12" [panelSizes]="[68, 32]" [minSizes]="[20, 10]">
    <ng-template #panel>
      <p-splitter [gutterSize]="12" [panelSizes]="[50, 50]" [minSizes]="[20, 20]">
        <ng-template #panel>
          <app-painel-visualizacao />
        </ng-template>
        <ng-template #panel>
          <app-painel-terminal />
        </ng-template>
      </p-splitter>
    </ng-template>
    <ng-template #panel>
      <app-painel-inferior />
    </ng-template>
  </p-splitter>
</main>
